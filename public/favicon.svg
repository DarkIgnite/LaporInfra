  </defs>

  <!-- Pin Shape -->
  <path d="M50 8C31.22 8 16 23.22 16 42C16 64 45 88 48.5 91C49.4 91.8 50.6 91.8 51.5 91C55 88 84 64 84 42C84 23.22 68.78 8 50 8Z" fill="url(#amberGrad)" filter="url(#shadow)"/>

